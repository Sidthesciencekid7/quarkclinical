[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder only — the REAL connection string comes from the DATABASE_URL
# env var, which alembic/env.py prefers over this value (see the note there).
# This generic localhost default is just a syntactically-valid fallback for a
# bare `alembic` invocation with no DATABASE_URL set; it holds no real secret.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/pkbe

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
