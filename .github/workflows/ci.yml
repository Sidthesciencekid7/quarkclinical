name: CI

# Runs the full test suite on every push and PR so a broken change can't reach
# production. Pair this with a branch-protection rule on `main` (Settings →
# Branches → require the "backend" and "frontend" checks to pass) so merges —
# and therefore deploys — are gated on green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pkbe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest.py points its engine at DATABASE_URL_TEST; the postgres service
      # above provides pkbe_test. Auth is forced off and AI is mocked in the
      # test suite itself (conftest sets CLERK_ISSUER="" and MOCK_AI=1), so no
      # real Clerk/Anthropic credentials are ever needed in CI.
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/pkbe_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only deps (not in requirements.txt, which is runtime-only):
          pip install pytest pytest-asyncio pytest-httpx pytest-mock

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend typecheck, tests + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
